[package]
name = "avianlink-desktop"
description = "Desktop messaging app for avianlink"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# rust-version is deliberately NOT inherited from the workspace: the library
# crates target an embedded MSRV (1.82), while the app's dependency tree
# (tauri, ts-rs) requires a newer toolchain. See docs/decisions.md DA-002.
rust-version = "1.85"

[lib]
# Tauri's mobile targets build the app as a library; `main.rs` is a thin
# wrapper so the same entry point works on desktop and later on iOS/Android.
name = "avianlink_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
avianlink-core = { workspace = true, features = ["std"] }
hex = "0.4.3"
rand_chacha = { workspace = true, features = ["std"] }
rand_core = { workspace = true, features = ["std", "getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true, features = ["std"] }
tauri = { version = "2.12", features = [] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
ts-rs = "12.0"

[lints]
workspace = true

[package]
name = "avianlink-core"
description = "Sans-IO, no_std engine for encrypted text messaging over lossy packet links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Conveniences for hosted platforms. The engine itself never needs std.
std = []

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand_chacha = { version = "0.10.0", default-features = false }

[lints]
workspace = true

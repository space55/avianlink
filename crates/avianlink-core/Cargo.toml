[package]
name = "avianlink-core"
description = "Sans-IO, no_std engine for encrypted text messaging over lossy packet links"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/space55/avianlink"
readme = "../../README.md"
keywords = ["messaging", "lora", "no-std", "encryption", "sans-io"]
categories = ["network-programming", "no-std", "cryptography", "embedded"]

[features]
default = []
# Conveniences for hosted platforms. The engine itself never needs std.
std = []

[dependencies]
rand_core = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true

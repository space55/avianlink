language = "C"
header = "/* avianlink C ABI. Generated by cbindgen from crates/avianlink-ffi; do not edit.\n * See docs/ffi.md for conventions (ownership, buffers, threading). */"
include_guard = "AVIANLINK_H"
include_version = false
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
prefix = ""
# Referenced only as integer fields (an out-of-range C enum would be UB in Rust).
include = ["AvlFecMode", "AvlBudgetKind"]

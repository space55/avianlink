[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/avianlink-core",
    "crates/avianlink-sim",
    "crates/avianlink-udp",
    "crates/avianlink-cli",
    "crates/avianlink-ffi",
    "crates/avianlink-relay",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/space55/avianlink"

[workspace.dependencies]
avianlink-core = { path = "crates/avianlink-core", version = "0.1.1" }
avianlink-sim = { path = "crates/avianlink-sim", version = "0.1.1" }
avianlink-udp = { path = "crates/avianlink-udp", version = "0.1.1" }
avianlink-relay = { path = "crates/avianlink-relay", version = "0.1.1" }
rand_core = { version = "0.10.1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# The simulation tests run hours of simulated traffic, and unoptimised
# crypto made the suite take minutes. Dependencies are always optimised;
# the workspace's own code lightly, in test builds only. Debug assertions
# and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

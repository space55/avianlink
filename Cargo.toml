[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/avianlink-core",
    "crates/avianlink-sim",
    "crates/avianlink-udp",
    "crates/avianlink-cli",
    "crates/avianlink-ffi",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "MIT"

[workspace.dependencies]
avianlink-core = { path = "crates/avianlink-core" }
avianlink-sim = { path = "crates/avianlink-sim" }
avianlink-udp = { path = "crates/avianlink-udp" }
rand_core = { version = "0.6.4", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.4", default-features = false }
zeroize = { version = "1.8", default-features = false }
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

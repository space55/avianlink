[package]
name = "avianlink-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
avianlink-sim = { path = "../crates/avianlink-sim" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "handle_packet"
path = "fuzz_targets/handle_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "restore"
path = "fuzz_targets/restore.rs"
test = false
doc = false
bench = false
